<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recruiting Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">LOCAL ARCHIVE</p>
      <h1>Recruiting tracker</h1>
      <p>Review application status and sponsorship evidence without exposing private source files.</p>
    </header>
    <section id="summary" class="summary" aria-label="Application summary"></section>
    <section class="panel">
      <div class="toolbar">
        <h2>Applications</h2>
        <label>Status <select id="status"><option value="">All</option></select></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Company</th><th>Role</th><th>Track</th><th>Status</th><th>Match</th><th>Sponsorship</th></tr></thead>
          <tbody id="applications"></tbody>
        </table>
      </div>
      <p id="message" role="status"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
